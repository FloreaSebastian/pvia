[project]
name = "pvia-geospatial-engine"
version = "1.0.0"
description = "PVIA Geospatial Engine — LiDAR HD / MNT / MNS / MNH processing and roof plane reconstruction"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "numpy>=1.26",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
]

# PDAL and GDAL are provided as native packages by the Docker image
# (python3-pdal / python3-gdal). They are intentionally NOT pip dependencies:
# the pip wheels do not ship the native libraries.

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
